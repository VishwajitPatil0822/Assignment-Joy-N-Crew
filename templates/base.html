{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#081716" id="theme-color-meta">
  <meta name="description" content="Joy-N-Crew — travel before the destination.">
  <title>{% block title %}Joy-N-Crew — The Travel Argument{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
  <form class="csrf-bootstrap" aria-hidden="true">{% csrf_token %}</form>
<div class="page-noise" aria-hidden="true"></div>
<header class="site-header">
  <a class="brand" href="{% url 'argument:home' %}">JOY-N-CREW</a>
  <nav class="desktop-nav" aria-label="Primary navigation">
    <a href="{% url 'argument:home' %}#argument">Discover</a>
    <a href="{% url 'argument:home' %}#idea">The Idea</a>
  </nav>
  <button class="theme-toggle" type="button" aria-label="Switch to day mode" aria-pressed="false">
    <span class="theme-icon theme-icon-moon" aria-hidden="true">☾</span>
    <span class="theme-icon theme-icon-sun" aria-hidden="true">☼</span>
    <span class="theme-label">NIGHT</span>
  </button>
  <a class="nav-cta" href="{% url 'argument:home' %}#argument">Start Exploring</a>
  <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">
    <span></span><span></span>
  </button>
  <div class="mobile-menu">
    <a href="{% url 'argument:home' %}#argument">Discover</a>
    <a href="{% url 'argument:home' %}#idea">The Idea</a>
    <a href="{% url 'argument:home' %}#argument" class="mobile-menu-cta">Start Exploring →</a>
  </div>
</header>
<main>{% block content %}{% endblock %}</main>
<script src="{% static 'js/site.js' %}?v=10x2"></script>
</body>
</html>
